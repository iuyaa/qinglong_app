<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, user-scalable=no"/>
    <link
            rel="stylesheet"
            href="codemirror/lib/codemirror.css"
    />
    <link
            rel="stylesheet"
            href="codemirror/theme/EDITOR_THEME.css"
    />
    <link
            rel="stylesheet"
            href="codemirror/addon/dialog/dialog.css"
    />
    <link
            rel="stylesheet"
            href="codemirror/addon/fold/foldgutter.css"
    />
    <title>Editor</title>
    <style>

      body {
        margin: 0px;
        padding: 0px;
      }
      #content {
        width: 100%;
        height: 100%;
        display: block;
      }
      .CodeMirror {float: left; width: 100%; height: 100%; }



    </style>
</head>
<body>
<div id="content"></div>
<script src="codemirror/lib/codemirror.js"></script>
<script src="codemirror/addon/search/search.js"></script>
<script src="codemirror/addon/dialog/dialog.js"></script>
<script src="codemirror/addon/search/searchcursor.js"></script>
<script src="codemirror/addon/search/match-highlighter.js"></script>
<script src="codemirror/addon/search/jump-to-line.js"></script>
<script src="codemirror/addon/fold/foldcode.js"></script>
<script src="codemirror/addon/fold/foldgutter.js"></script>
<script src="codemirror/addon/fold/brace-fold.js"></script>
<script src="codemirror/addon/fold/xml-fold.js"></script>
<script src="codemirror/addon/fold/markdown-fold.js"></script>
<script src="codemirror/addon/fold/comment-fold.js"></script>
<script src="codemirror/addon/fold/indent-fold.js"></script>
<script src="codemirror/mode/EDITOR_MODE/EDITOR_MODE.js"></script>

<script type="text/javascript">
      const element = document.querySelector("#content");
      const editor = CodeMirror(element, {
        lineNumbers: false,
        theme: "EDITOR_THEME",
        mode: "EDITOR_MODE",
        readOnly: true,
        lineWrapping: true,
        styleActiveLine: true,
        matchBrackets: true,
        foldGutter: 'EDITOR_MODE' == 'shell'?{}:{
                rangeFinder: new CodeMirror.fold.combine(CodeMirror.fold.indent,CodeMirror.fold.comment)
            },
        gutters: 'EDITOR_MODE' == 'shell'?[]:["CodeMirror-linenumbers", "CodeMirror-foldgutter"]
      });
      editor.on('copy', (cm, e) => {
        e.codemirrorIgnore = true;
      });

      editor.on("change", (event) => {
        const value = event.getValue();
        MessageInvoker.postMessage(value);
      });
      editor.refresh();
      function searchText(){
        editor.execCommand('findPersistent');
      }
      function clearSearchText(){
        editor.execCommand('clearSearch');
      }

</script>
</body>
</html>
